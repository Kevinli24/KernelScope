name: kernelscope
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kernelscope}
      POSTGRES_USER: ${POSTGRES_USER:-kernelscope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kernelscope}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kernelscope}:${POSTGRES_PASSWORD:-kernelscope}@db:5432/${POSTGRES_DB:-kernelscope}
      API_PORT: 3001
    ports:
      - '3001:3001'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3001/health']
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kernelscope}:${POSTGRES_PASSWORD:-kernelscope}@db:5432/${POSTGRES_DB:-kernelscope}
      GPU_MODE: ${GPU_MODE:-mock}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-1}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
    ports:
      - '5173:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
