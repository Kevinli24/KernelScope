[project]
name = "kernelscope-worker"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2.9"]

[project.optional-dependencies]
dev = ["pytest>=8.4.1", "ruff>=0.12.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

